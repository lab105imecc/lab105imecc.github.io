<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Eixos -->
  <line x1="12" y1="88" x2="12" y2="8" stroke="#1a2a4a" stroke-width="4" stroke-linecap="round"/>
  <line x1="12" y1="88" x2="92" y2="88" stroke="#1a2a4a" stroke-width="4" stroke-linecap="round"/>

  <!-- Tracinhos eixo Y -->
  <g stroke="#1a2a4a" stroke-width="1.5" stroke-linecap="round">
    <line x1="9"  y1="72" x2="15" y2="72"/>
    <line x1="9"  y1="56" x2="15" y2="56"/>
    <line x1="9"  y1="40" x2="15" y2="40"/>
    <line x1="9"  y1="24" x2="15" y2="24"/>
  </g>

  <!-- Tracinhos eixo X -->
  <g stroke="#1a2a4a" stroke-width="1.5" stroke-linecap="round">
    <line x1="28" y1="85" x2="28" y2="91"/>
    <line x1="44" y1="85" x2="44" y2="91"/>
    <line x1="60" y1="85" x2="60" y2="91"/>
    <line x1="76" y1="85" x2="76" y2="91"/>
  </g>

  <!-- Linha de regressão com seta -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 Z" fill="#C9A84C"/>
    </marker>
  </defs>
  <line x1="16" y1="82" x2="82" y2="16"
        stroke="#C9A84C" stroke-width="5" stroke-linecap="round"
        marker-end="url(#arrow)"/>

  <!-- Pontos do scatter -->
  <g fill="#C9A84C" stroke="#1a2a4a" stroke-width="1.5">
    <circle cx="22" cy="74" r="5"/>
    <circle cx="30" cy="62" r="5"/>
    <circle cx="36" cy="70" r="5"/>
    <circle cx="44" cy="52" r="5"/>
    <circle cx="50" cy="44" r="5"/>
    <circle cx="58" cy="58" r="5"/>
    <circle cx="64" cy="36" r="5"/>
    <circle cx="72" cy="50" r="5"/>
    <circle cx="78" cy="30" r="5"/>
  </g>
</svg>
