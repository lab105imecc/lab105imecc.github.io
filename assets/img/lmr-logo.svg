<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2f50"/>
      <stop offset="100%" stop-color="#0b1827"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e0c97a"/>
      <stop offset="100%" stop-color="#a87d20"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="chartClip">
      <rect x="52" y="18" width="142" height="132"/>
    </clipPath>
  </defs>

  <!-- Fundo arredondado -->
  <rect width="200" height="200" rx="26" fill="url(#bgG)"/>

  <!-- Grade pontilhada -->
  <g opacity="0.1" clip-path="url(#chartClip)">
    <line x1="52" y1="50"  x2="194" y2="50"  stroke="#C9A84C" stroke-width="0.7" stroke-dasharray="2,8"/>
    <line x1="52" y1="83"  x2="194" y2="83"  stroke="#C9A84C" stroke-width="0.7" stroke-dasharray="2,8"/>
    <line x1="52" y1="116" x2="194" y2="116" stroke="#C9A84C" stroke-width="0.7" stroke-dasharray="2,8"/>
    <line x1="90"  y1="18" x2="90"  y2="150" stroke="#C9A84C" stroke-width="0.7" stroke-dasharray="2,8"/>
    <line x1="130" y1="18" x2="130" y2="150" stroke="#C9A84C" stroke-width="0.7" stroke-dasharray="2,8"/>
    <line x1="170" y1="18" x2="170" y2="150" stroke="#C9A84C" stroke-width="0.7" stroke-dasharray="2,8"/>
  </g>

  <!-- Letra L (eixos sólidos) -->
  <rect x="22" y="18" width="30" height="140" rx="7" fill="url(#goldG)" filter="url(#glow)"/>
  <rect x="22" y="132" width="164" height="30" rx="7" fill="url(#goldG)" filter="url(#glow)"/>

  <!-- Tracinhos de escala -->
  <g stroke="#0b1827" stroke-width="1.5" opacity="0.5">
    <line x1="43" y1="50"  x2="52" y2="50"/>
    <line x1="43" y1="83"  x2="52" y2="83"/>
    <line x1="43" y1="116" x2="52" y2="116"/>
    <line x1="90"  y1="132" x2="90"  y2="122"/>
    <line x1="130" y1="132" x2="130" y2="122"/>
    <line x1="170" y1="132" x2="170" y2="122"/>
  </g>

  <!-- Bolinha de origem -->
  <circle cx="37" cy="147" r="5.5" fill="#fff" opacity="0.9"/>
  <circle cx="37" cy="147" r="3"   fill="#C9A84C"/>

  <!-- Banda de confiança -->
  <polygon
    points="60,138 74,123 90,111 107,96 124,82 142,66 160,52 176,38
            176,52 160,66 142,80 124,96 107,110 90,125 74,137 60,152"
    fill="#C9A84C" opacity="0.13" clip-path="url(#chartClip)"/>

  <!-- Linhas de resíduo -->
  <g stroke="#e8edf5" stroke-width="0.9" stroke-dasharray="3,4" opacity="0.35" clip-path="url(#chartClip)">
    <line x1="68"  y1="130" x2="68"  y2="143"/>
    <line x1="84"  y1="122" x2="84"  y2="115"/>
    <line x1="100" y1="113" x2="100" y2="100"/>
    <line x1="118" y1="92"  x2="118" y2="84"/>
    <line x1="138" y1="79"  x2="138" y2="66"/>
    <line x1="156" y1="60"  x2="156" y2="52"/>
  </g>

  <!-- Linha de regressão -->
  <line x1="58" y1="145" x2="178" y2="38"
        stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.88"
        clip-path="url(#chartClip)"/>

  <!-- Scatter points -->
  <g clip-path="url(#chartClip)">
    <circle cx="68"  cy="130" r="6"   fill="#fff" stroke="#C9A84C" stroke-width="2"/>
    <circle cx="84"  cy="122" r="5"   fill="#fff" stroke="#C9A84C" stroke-width="1.8"/>
    <circle cx="100" cy="113" r="6.5" fill="#fff" stroke="#C9A84C" stroke-width="2"/>
    <circle cx="118" cy="92"  r="5"   fill="#fff" stroke="#C9A84C" stroke-width="1.8"/>
    <circle cx="134" cy="76"  r="6"   fill="#fff" stroke="#C9A84C" stroke-width="2"/>
    <circle cx="152" cy="60"  r="5.5" fill="#fff" stroke="#C9A84C" stroke-width="1.8"/>
    <circle cx="170" cy="44"  r="6"   fill="#fff" stroke="#C9A84C" stroke-width="2"/>
  </g>

  <!-- MR -->
  <text x="178" y="152" text-anchor="end"
        font-family="Arial, sans-serif" font-size="13" font-weight="700"
        fill="#0b1827" opacity="0.55" letter-spacing="1">MR</text>
</svg>
