<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo branco -->
  <rect width="100" height="100" fill="white"/>

  <!-- Eixos -->
  <line x1="24" y1="81" x2="24" y2="18" stroke="#1a2a4a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="24" y1="81" x2="87" y2="81" stroke="#1a2a4a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Tracinhos eixo Y -->
  <g stroke="#1a2a4a" stroke-width="1.2" stroke-linecap="round">
    <line x1="21" y1="67" x2="27" y2="67"/>
    <line x1="21" y1="53" x2="27" y2="53"/>
    <line x1="21" y1="39" x2="27" y2="39"/>
    <line x1="21" y1="25" x2="27" y2="25"/>
  </g>

  <!-- Tracinhos eixo X -->
  <g stroke="#1a2a4a" stroke-width="1.2" stroke-linecap="round">
    <line x1="38" y1="78" x2="38" y2="84"/>
    <line x1="52" y1="78" x2="52" y2="84"/>
    <line x1="66" y1="78" x2="66" y2="84"/>
    <line x1="80" y1="78" x2="80" y2="84"/>
  </g>

  <!-- Reta de regressão -->
  <line x1="27" y1="77" x2="68" y2="33"
        stroke="#C9A84C" stroke-width="3" stroke-linecap="round"/>

  <!-- R no final da linha -->
  <text x="69" y="32" font-family="Arial Black, Arial, sans-serif" font-size="12"
        font-weight="900" fill="#C9A84C">R</text>

  <!-- Pontos em forma de M -->
  <g fill="#C9A84C" stroke="#1a2a4a" stroke-width="1.2">
    <circle cx="33" cy="73" r="3.5"/>
    <circle cx="34" cy="60" r="3.5"/>
    <circle cx="32" cy="47" r="3.5"/>
    <circle cx="33" cy="35" r="3.5"/>
    <circle cx="41" cy="45" r="3.5"/>
    <circle cx="48" cy="55" r="3.5"/>
    <circle cx="54" cy="61" r="3.5"/>
    <circle cx="61" cy="51" r="3.5"/>
    <circle cx="67" cy="41" r="3.5"/>
    <circle cx="74" cy="33" r="3.5"/>
    <circle cx="73" cy="47" r="3.5"/>
    <circle cx="75" cy="59" r="3.5"/>
    <circle cx="74" cy="71" r="3.5"/>
  </g>
</svg>
