<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Eixos -->
  <line x1="14" y1="86" x2="14" y2="10" stroke="#1a2a4a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="14" y1="86" x2="90" y2="86" stroke="#1a2a4a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Tracinhos eixo Y -->
  <g stroke="#1a2a4a" stroke-width="1.2" stroke-linecap="round">
    <line x1="11" y1="70" x2="17" y2="70"/>
    <line x1="11" y1="54" x2="17" y2="54"/>
    <line x1="11" y1="38" x2="17" y2="38"/>
    <line x1="11" y1="22" x2="17" y2="22"/>
  </g>

  <!-- Tracinhos eixo X -->
  <g stroke="#1a2a4a" stroke-width="1.2" stroke-linecap="round">
    <line x1="30" y1="83" x2="30" y2="89"/>
    <line x1="46" y1="83" x2="46" y2="89"/>
    <line x1="62" y1="83" x2="62" y2="89"/>
    <line x1="78" y1="83" x2="78" y2="89"/>
  </g>

  <!-- Reta de regressão -->
  <line x1="18" y1="80" x2="74" y2="22"
        stroke="#C9A84C" stroke-width="3" stroke-linecap="round"/>

  <!-- R no final da linha -->
  <text x="75" y="21" font-family="Arial Black, Arial, sans-serif" font-size="13"
        font-weight="900" fill="#C9A84C">R</text>

  <!-- Pontos em forma de M -->
  <g fill="#C9A84C" stroke="#1a2a4a" stroke-width="1.2">
    <!-- Perna esquerda do M -->
    <circle cx="22" cy="78" r="3.5"/>
    <circle cx="23" cy="65" r="3.5"/>
    <circle cx="21" cy="52" r="3.5"/>
    <circle cx="22" cy="40" r="3.5"/>
    <!-- Diagonal esq descendo ao centro -->
    <circle cx="30" cy="50" r="3.5"/>
    <circle cx="37" cy="60" r="3.5"/>
    <!-- Centro do V -->
    <circle cx="43" cy="66" r="3.5"/>
    <!-- Diagonal dir subindo -->
    <circle cx="50" cy="56" r="3.5"/>
    <circle cx="56" cy="46" r="3.5"/>
    <!-- Perna direita do M -->
    <circle cx="63" cy="38" r="3.5"/>
    <circle cx="62" cy="52" r="3.5"/>
    <circle cx="64" cy="64" r="3.5"/>
    <circle cx="63" cy="76" r="3.5"/>
  </g>
</svg>
